name: Local Audio
version: "0.1.10"
slug: local_audio
description: >-
  Turns this Home Assistant system into a synchronized Sendspin player and
  audio source for Music Assistant, using speakers or a USB DAC for playback
  and a local or USB audio input as a source.
url: https://github.com/music-assistant/local-audio-addon
image: ghcr.io/music-assistant/local-audio-addon
arch:
  - amd64
  - aarch64
# Promotion to stable waits on validation against real Home Assistant OS
# hardware, which this release has not had.
stage: experimental
# Before Home Assistant, so the Sendspin client is already advertising by the
# time Music Assistant starts looking for it.
startup: services
# The image brings its own s6-overlay v3 init.
init: false
# The mDNS advertisement, and the inbound websocket the server connects back in
# on, both need the host's network namespace.
host_network: true
# Maps Home Assistant's PulseAudio in: an /etc/asound.conf routing `default` to
# it, a client.conf naming the sink/source, and the socket under /run/audio. It
# also gives this app separate native Audio input and output selectors.
audio: true
options:
  # Empty rather than absent, so the configuration screen shows the field
  # instead of folding it away as unused. An empty name is the default,
  # "Local Audio".
  name: ""
  player_enabled: true
  source_enabled: true
  line_sense: true
  line_sense_dbfs: -50
  line_sense_attack_ms: 300
  line_sense_release_ms: 5000
  log_level: info
# `server` is optional with no default on purpose: setting one switches the
# player to dialling out, which suppresses its mDNS advertisement, so the field
# belongs behind the fold a user has to open deliberately.
schema:
  name: str?
  player_enabled: bool
  source_enabled: bool
  line_sense: bool
  line_sense_dbfs: int
  line_sense_attack_ms: int
  line_sense_release_ms: int
  log_level: list(debug|info|warning|error)
  server: str?

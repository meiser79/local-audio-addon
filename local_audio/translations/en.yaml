configuration:
  name:
    name: Player name
    description: >-
      The name this player shows up under in Music Assistant. Leave it empty and
      it is called "Local Audio".
  player_enabled:
    name: Enable player role
    description: >-
      Advertise player@v1 and allow Music Assistant to use this device for
      synchronized audio playback.
  source_enabled:
    name: Enable source role
    description: >-
      Advertise source@v1 and allow Music Assistant to use this device's selected
      audio input as a live source.
  legacy_mode:
    name: Legacy source stream mode
    description: >-
      Use the legacy client_stream/start and client_stream/end message names for
      compatibility with older Music Assistant/aiosendspin versions. Disable this
      to use the current Sendspin specification names client-stream/start and
      client-stream/end.
  log_level:
    name: Log level
    description: >-
      How much this player writes to its log. Raise it to debug while chasing a
      problem, and put it back afterwards.
  server:
    name: Music Assistant server
    description: >-
      Leave this empty and the player waits to be found over mDNS, which is what
      you want. Set it to a host, host:port or ws:// URL only if the server
      cannot discover the player by itself — doing so also stops the player
      being discoverable. Do not put a password in here; it is stored and shown
      as plain text.

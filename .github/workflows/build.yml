name: Build

# Every push to main and every pull request. Nothing here publishes anything -- release.yml owns
# that, and it is reached only by a tag. A `push` naming only `branches` does not fire for tags
# at all, which is the whole of how a `v*` push is left to the other workflow. The mirror of that
# rule is a trap worth naming: a `push` naming only `tags` does not fire for branches, so
# `tags-ignore: '**'` reads like "everything except tags" and means "nothing at all".
on:
  push:
    branches:
      - main
  pull_request:

# A superseded push has nothing left to say. This does not collapse the push/PR pair above:
# those carry different refs and so land in different groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Named rather than left to the default, which is `bash -e` with no pipefail.
    shell: bash

jobs:
  # A gate rather than a claim: the workflows and the scripts they call are asserted to be clean,
  # and an assertion nothing enforces is one that stops being true. Both tools are here because
  # this repo's whole release path runs through the shell script below.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Every third-party action here is pinned to a commit rather than a tag, because a tag can
      # be repointed at any time and these run with access to the workspace. The trailing comment
      # is the version that commit was, for whoever bumps it.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actionlint's own container rather than an action wrapping it: one fewer third party with
      # access to the workspace, and the pin is the digest below rather than somebody's tag. That
      # digest is actionlint 1.7.12; it is a `run:` script rather than a `uses:` line, so no bot
      # watches it and the version is recorded here for whoever bumps it.
      - name: Lint the workflows
        run: |
          docker run --rm --volume "$PWD:/repo" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      # Two invocations, and the split is what keeps this clean without suppressing anything.
      #
      # The rootfs scripts are the entry points only -- the shared library they source is not
      # named here. `-x` with `--source-path=rootfs` resolves its absolute `source` path inside
      # the tree and analyses it in the context that uses it, which is the only context where its
      # variables are used at all: linting it on its own would report every path it defines as
      # unused and need an exclusion to say otherwise. `--shell=bash` because s6's
      # `#!/command/with-contenv bash` is a shebang shellcheck does not know, and the alternative
      # is a directive in each of five shipped files.
      - name: Lint the shell scripts
        run: |
          shellcheck --shell=bash --external-sources --source-path=rootfs \
            rootfs/usr/bin/container-healthcheck \
            rootfs/usr/lib/sendspin-cli/decide-daemons \
            rootfs/etc/s6-overlay/s6-rc.d/*/run \
            rootfs/etc/s6-overlay/s6-rc.d/*/finish
          shellcheck scripts/*.sh

  # The add-on manifest is what the Home Assistant add-on store reads, and one the Supervisor
  # rejects is a card that never appears -- a failure with no local symptom at all. This is the
  # only check anywhere that can see it, so it is worth its own job.
  #
  # local_audio/ arrives on its own branch, so this job is red until that branch lands. That is
  # deliberate rather than overlooked: a step guarded on the manifest existing would go on
  # reporting green after a rename, and a rename is exactly what is worth catching here.
  addon-lint:
    name: add-on manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `community` is left at its default, and that is load-bearing rather than incidental:
      # everything past the linter's build-file section is gated on that input, and that branch
      # requires the version to be literally `dev` and a build.json to exist. This add-on has a
      # real version and no build file, because its image is prebuilt rather than built by the
      # store -- so turning this on would fail it on both counts.
      - name: Lint the add-on manifest
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./local_audio

  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # The build compiles the player from source and then runs the smoke suite twice. Well clear
    # of that, and far under the six-hour default: the point is that a container which ignores
    # SIGTERM fails a leg rather than holding a runner all day.
    timeout-minutes: 60
    strategy:
      # Every leg's result is wanted rather than only the first failure's: a break that shows on
      # one architecture and not the other is precisely what the matrix is here to tell apart.
      fail-fast: false
      matrix:
        include:
          # Native runners on both legs, so nothing here needs qemu. `ubuntu-24.04-arm` is a
          # standard GitHub-hosted runner, generally available and free for public repositories
          # since August 2025 -- and available in private ones, at two vCPUs rather than four,
          # since January 2026, so a private fork still builds.
          - arch: amd64
            runner: ubuntu-24.04
            # The digests the Dockerfile's own comments record, one per architecture, and the
            # only place the pair lives together -- bump them together, and on the same Debian
            # release, because the player is linked against that image's libc. Passed rather
            # than defaulted: the Dockerfile's default is the amd64 one, so the arm64 leg has to
            # be told, and floating either of them to a tag is what these pins exist to prevent.
            base: ghcr.io/home-assistant/amd64-base-debian@sha256:9281ee991c28532ddae10114ac84750f4aca287a496f6e19583f3a750ad5e786
            # What `docker image inspect` calls the result. Spelled out per leg because the sharp
            # edge here is silent: a leg handed the other architecture's base builds an image
            # whose player cannot exec, and every check after it fails for a reason that never
            # names the cause. Note the third spelling of one thing -- the runner label says
            # `arm`, docker says `arm64`, and the add-on manifest says `aarch64`.
            expect_arch: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            base: ghcr.io/home-assistant/aarch64-base-debian@sha256:acc61c0ab60cbca176ec0fe4d37278be514a4a6babfc1becde951c99d17e92f0
            expect_arch: arm64
    env:
      IMAGE: local-audio:ci
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No assertion on the build output, deliberately: the Dockerfile greps its own configure
      # log for the audio backends and the mDNS provider, so a missing -dev package -- which
      # CMake would otherwise drop the backend for and carry on from -- fails the build here
      # rather than shipping a silently degraded player.
      #
      # `docker build` and not buildx, unlike release.yml, which needs buildx to push a digest
      # without a tag. Nothing is published from here, so the plain builder is the fewer moving
      # parts; the asymmetry is worth leaving rather than unifying.
      - name: Build the image
        env:
          BASE: ${{ matrix.base }}
        run: docker build --build-arg "BUILD_FROM=$BASE" --tag "$IMAGE" .

      - name: Check the image is the architecture this leg builds for
        env:
          EXPECT_ARCH: ${{ matrix.expect_arch }}
        run: |
          arch="$(docker image inspect --format '{{.Architecture}}' "$IMAGE")"
          echo "image architecture: $arch"
          [ "$arch" = "$EXPECT_ARCH" ] || {
            echo "::error::built a $arch image on the $EXPECT_ARCH leg -- check BUILD_FROM"
            exit 1
          }

      # Twice, because where the options come from is the riskiest logic in the image and the two
      # sources share no code above `sendspin::read_options`. Standalone is what a Compose user
      # gets. Add-on is the bashio branch, which nothing else exercises: it stands up a stand-in
      # Supervisor and asserts both that the options arrived over the API, authenticated, and
      # that a Supervisor the container cannot reach stops it rather than starting a player on
      # defaults nobody chose.
      - name: Smoke test, standalone mode
        run: scripts/smoke_test.sh "$IMAGE" --mode standalone

      - name: Smoke test, add-on mode
        run: scripts/smoke_test.sh "$IMAGE" --mode addon

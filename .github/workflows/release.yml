name: Release

# A human tags; this publishes what that tag builds. Nothing here creates a tag, and there is no
# second trigger -- no branch push, no pull request, no schedule, no `workflow_dispatch` -- so the
# only way to reach a published manifest is to have pushed a `v*` tag. build.yml filters on
# branches and so never fires for a tag, leaving one workflow to answer for one tag.
on:
  push:
    tags:
      - 'v*'

# Deliberately no `concurrency` block, where build.yml has one. Its `cancel-in-progress: true`
# could cancel a run midway through assembling the manifest, which is the partial state the
# arrangement below exists to make impossible. A tag is pushed once, so nothing supersedes it.

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Ahead of the matrix, so a mistyped tag does not burn two runners for half an hour first. The
  # one thing checkable without building is that the tag and the add-on manifest agree on the
  # version: the store card pulls `image:version`, and a manifest naming a tag that was never
  # pushed is an add-on that cannot install.
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag names the version the add-on manifest declares
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          manifest=local_audio/config.yaml
          [ -f "$manifest" ] || {
            echo "::error::$manifest does not exist -- there is no version to publish against"
            exit 1
          }

          # The `v*` trigger also matches v0.1.0rc1, which would be published as `latest` with
          # nobody having decided that it should be. Refused here rather than handled, and the
          # refusal is a decision rather than an oversight: Home Assistant accepts a PEP 440
          # prerelease as an add-on version, and Music Assistant ships its betas as a separate
          # add-on slug pointing at a separate image. Whoever first wants a prerelease of this
          # one can decide which of those it should be.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH; this workflow publishes releases only"
            exit 1
          }

          # Counted rather than read first-match-wins, which is what catches a second `version:`
          # line appearing further down the file: taking the first would silently pick between
          # them. `|| true` because `grep -c` exits 1 on a count of zero and this shell runs
          # under `-e`, so without it the step dies on the assignment and the message below --
          # the one that says what is actually wrong -- never prints.
          pattern='^version:[[:space:]]*"?[0-9]+\.[0-9]+\.[0-9]+"?[[:space:]]*$'
          matches="$(grep -cE "$pattern" "$manifest" || true)"
          [ "$matches" = 1 ] || {
            echo "::error::expected exactly one MAJOR.MINOR.PATCH version: line in $manifest, found $matches"
            exit 1
          }
          version="$(sed -nE 's/^version:[[:space:]]*"?([0-9]+\.[0-9]+\.[0-9]+)"?[[:space:]]*$/\1/p' "$manifest")"

          echo "tag $TAG, $manifest version $version"
          [ "$TAG" = "v$version" ] || {
            echo "::error::tag $TAG does not match $manifest version $version -- bump one to match the other"
            exit 1
          }
          echo "version=$version" >>"$GITHUB_OUTPUT"

  # One leg per architecture, on the same native runners build.yml uses, and each one pushes an
  # image nothing yet refers to. The order matters: the digest is pushed first, then pulled back
  # and smoke-tested *by that digest*, so the bits tested are the bits pushed by identity rather
  # than by an argument about build caches. A leg that fails its smoke leaves an unreferenced
  # digest behind, which no tag names and nothing will pull.
  publish:
    name: ${{ matrix.arch }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Scoped to this job rather than the workflow, which stays read-only. `contents: read` is
    # restated because naming any permission drops the rest to none.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same two legs and the same two base digests as build.yml, duplicated rather than
          # shared because a reusable workflow cannot own the `strategy.matrix` that is the thing
          # worth not duplicating. Bump them together.
          - arch: amd64
            runner: ubuntu-24.04
            base: ghcr.io/home-assistant/amd64-base-debian@sha256:9281ee991c28532ddae10114ac84750f4aca287a496f6e19583f3a750ad5e786
            expect_arch: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            base: ghcr.io/home-assistant/aarch64-base-debian@sha256:acc61c0ab60cbca176ec0fe4d37278be514a4a6babfc1becde951c99d17e92f0
            expect_arch: arm64
    env:
      # Follows the repository, so a fork publishes into its own namespace rather than failing on
      # a push it has no rights to. On the canonical repository this is exactly the `image:` the
      # add-on manifest names. A fork under an owner whose name carries capitals would be refused
      # by the registry, which only takes lower case; the refusal says so.
      REPO: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Needed for the push below and for nothing else: the default builder cannot push an image
      # by digest without also giving it a tag, and a tag is the one thing a leg on its own must
      # not create.
      - name: Set up buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `push-by-digest=true` with `name-canonical=true` pushes the manifest and reports its
      # digest without writing any tag, which is what makes a half-finished release harmless.
      #
      # Provenance and SBOM off: with them on, each push is an index wrapping the real manifest
      # plus an attestation manifest whose platform is `unknown/unknown`, and the manifest job
      # below would assemble a list carrying two phantom entries beside the two real ones. Home
      # Assistant pulls such an image happily -- Music Assistant's own server image has those
      # entries today -- so this buys a manifest that says what it contains rather than fixing
      # a break.
      #
      # The digest is read from the metadata file rather than scraped out of the build log.
      - name: Build and push this architecture by digest
        id: push
        env:
          BASE: ${{ matrix.base }}
        run: |
          docker buildx build \
            --build-arg "BUILD_FROM=$BASE" \
            --provenance=false \
            --sbom=false \
            --metadata-file metadata.json \
            --output "type=image,name=$REPO,push-by-digest=true,name-canonical=true,push=true" \
            .
          digest="$(jq -er '."containerimage.digest"' metadata.json)"
          echo "pushed $REPO@$digest"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Pull back what was pushed
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: docker pull "$REPO@$DIGEST"

      - name: Check the image is the architecture this leg builds for
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          EXPECT_ARCH: ${{ matrix.expect_arch }}
        run: |
          arch="$(docker image inspect --format '{{.Architecture}}' "$REPO@$DIGEST")"
          echo "image architecture: $arch"
          [ "$arch" = "$EXPECT_ARCH" ] || {
            echo "::error::pushed a $arch image on the $EXPECT_ARCH leg -- check BUILD_FROM"
            exit 1
          }

      # The same suite build.yml runs on a push, run against the pushed digest. A release is
      # gated on exactly what a push is gated on, both option sources included.
      - name: Smoke test, standalone mode
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: scripts/smoke_test.sh "$REPO@$DIGEST" --mode standalone

      - name: Smoke test, add-on mode
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: scripts/smoke_test.sh "$REPO@$DIGEST" --mode addon

      # A matrix leg cannot hand a per-leg value to a later job through `outputs`, so the digest
      # travels as a file named after the architecture that produced it. The manifest job asserts
      # the set of names it receives, which a count could not do.
      - name: Record the digest for the manifest job
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p digests
          printf '%s' "$DIGEST" >"digests/$ARCH"

      - name: Upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error

  # The only job that publishes anything a user can pull. It needs both legs green, so a release
  # is either a complete two-architecture manifest or it is nothing: the digests the legs pushed
  # are unreferenced until this runs, and stay that way if it does not.
  manifest:
    name: manifest
    needs: [preflight, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      REPO: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      # `imagetools` talks to the registry rather than to a builder, but the buildx CLI is what
      # carries the subcommand, and a tag push is the first chance to find this one broken. Set
      # up explicitly rather than left to whatever builder the runner image ships with.
      - name: Set up buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # `merge-multiple`, or each artifact arrives in a directory named after itself and the
      # paths below gain a redundant level. No `name:` or `pattern:`, so this asks for whatever
      # the legs produced: the assertion that follows is what says whether that was the right
      # set, and a pattern here would pre-filter the evidence.
      - name: Download the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests
          merge-multiple: true

      - name: Check every architecture reported a digest
        run: |
          # The set rather than the count. `needs: publish` does not cover a leg that went green
          # having uploaded nothing, and "exactly two" is satisfied by the wrong two.
          found="$(find digests -maxdepth 1 -type f -exec basename {} \; | sort | tr '\n' ' ')"
          expected='aarch64 amd64 '
          echo "digests received from: $found"
          [ "$found" = "$expected" ] || {
            echo "::error::expected digests from '$expected' but got '$found'"
            exit 1
          }
          for arch in aarch64 amd64; do
            grep -Eq '^sha256:[0-9a-f]{64}$' "digests/$arch" || {
              echo "::error::digests/$arch is not a sha256 digest: $(cat "digests/$arch")"
              exit 1
            }
          done

      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both tags in one call, from one index, so `latest` cannot come to mean something the
      # version tag does not. The version tag is what the add-on manifest's `image:version` pulls
      # and so the one that matters; `latest` is there for a `docker run` by hand.
      - name: Assemble and push the multi-architecture manifest
        run: |
          docker buildx imagetools create \
            --tag "$REPO:$VERSION" \
            --tag "$REPO:latest" \
            "$REPO@$(cat digests/amd64)" \
            "$REPO@$(cat digests/aarch64)"

      # What was published, read back from the registry rather than assumed from the command
      # above having exited 0. Two platforms and nothing else: an entry for an architecture the
      # add-on manifest does not declare, or a phantom `unknown/unknown` one, means something
      # upstream of here changed what it pushes.
      - name: Check the published manifest lists both architectures
        run: |
          platforms="$(docker buildx imagetools inspect --raw "$REPO:$VERSION" |
            jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' | sort | tr '\n' ' ')"
          echo "published platforms: $platforms"
          [ "$platforms" = 'linux/amd64 linux/arm64 ' ] || {
            echo "::error::$REPO:$VERSION lists '$platforms', expected 'linux/amd64 linux/arm64 '"
            exit 1
          }
          echo "published $REPO:$VERSION and $REPO:latest"
